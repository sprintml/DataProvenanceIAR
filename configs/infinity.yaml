# Infinity -- bit-wise, next-scale prediction IAR (Han et al., 2024).
# High-resolution; uses QuantLoss directly (no optimized search needed).
#
# NOTE: set the weight paths below to the official Infinity release files
# (see docs/MODELS.md). The text encoder is FLAN-T5-XL.
name: infinity
model: infinity
image_size: 1024
value_range: pm1

# --- base weights ---
vae_type: 32                           # bit-wise codebook dimension (2^32)
vae_path: ""                           # infinity_vae_d32reg.pth
model_path: ""                         # infinity_2b_reg.pth
text_encoder: google/flan-t5-xl
model_type: infinity_2b
apply_spatial_patchify: 0
pn: "1M"                               # resolution schedule key
h_div_w_template: 1.000

token_optim: false

# --- generation ---
batch_size: 2
cfg_scale: 3.0

# --- encoder selection for evaluation ---
encoder: finetuned
hf_encoder_repo: ""
# finetuned_encoder: /abs/path/encoder_final.pth

# --- inverse-decoder finetuning ---
finetune:
  epochs: 10
  batch_size: 2
  lr: 1.0e-5
  optimizer: adam
  betas: [0.9, 0.95]
  feat_weight: 1.0
  img_weight: 0.0
  lpips_weight: 0.0
  scheduler: {name: steplr, step_size: 2, gamma: 0.9}
  num_workers: 4
